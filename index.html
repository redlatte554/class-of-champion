<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Of Champion — Game Kuis SDGs</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#EAF4FF;--surface:#FFFFFF;--ink:#0B2540;--muted:#566F8A;--line:#C6DDF4;--accent:#1457FF;--cyan:#00B8F0;--tile:#BFE2FF;--tile-hi:#8FCBFF;--tile-ink:#0B2540;--ok:#14A44D;--bad:#E03131;--shadow:0 10px 30px rgba(20,87,255,.13);--soft:#F3F9FF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#061326;--surface:#0D2240;--ink:#E7F1FF;--muted:#8CA8C9;--line:#1B3A64;--accent:#5B95FF;--shadow:0 10px 30px rgba(0,0,0,.45);--soft:#102A4E}}
:root[data-theme="dark"]{--bg:#061326;--surface:#0D2240;--ink:#E7F1FF;--muted:#8CA8C9;--line:#1B3A64;--accent:#5B95FF;--shadow:0 10px 30px rgba(0,0,0,.45);--soft:#102A4E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);color:var(--ink);font:500 15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;background-position:-1px -1px}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(900px 400px at 85% -10%,rgba(0,184,240,.18),transparent),radial-gradient(700px 400px at -10% 10%,rgba(20,87,255,.14),transparent);pointer-events:none;z-index:0}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:16px 18px 40px}
h1,h2,h3,.disp{font-family:Sora,"Plus Jakarta Sans",system-ui,sans-serif}
/* header */
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.brand h1{margin:0;font-size:clamp(28px,5vw,52px);line-height:1;font-weight:800;letter-spacing:-.02em}
.brand h1 .flask{display:inline-block;transform:rotate(-12deg);margin-right:6px}
.brand p{margin:8px 0 0;color:var(--accent);font-weight:700;letter-spacing:.02em;font-size:clamp(13px,2vw,17px)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(20,87,255,.28);transition:transform .12s,filter .12s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ok{background:var(--ok);box-shadow:0 4px 14px rgba(20,164,77,.3)}
.btn.bad{background:var(--bad);box-shadow:0 4px 14px rgba(224,49,49,.3)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip b{font-weight:700}
.chip.st{border-color:currentColor;font-weight:700}
.st-idle{color:#7A8CA3}.st-running{color:var(--ok)}.st-paused{color:#D98A00}.st-over{color:var(--bad)}
.welcome{background:linear-gradient(90deg,var(--accent),var(--cyan));color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.welcome .btn{background:rgba(255,255,255,.2);box-shadow:none}
/* login */
.login{max-width:520px;margin:30px auto;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}
.login h2{margin:0 0 4px;font-size:26px}
.login p{margin:0 0 18px;color:var(--muted)}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-weight:700;font-size:13px;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:var(--soft);outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus,.opt:focus-visible,.btn:focus-visible,.tile:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.err{color:var(--bad);font-weight:700;margin:6px 0 0;min-height:20px}
/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 12px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.tile{position:relative;border:2px solid var(--tile-hi);background:var(--tile);color:var(--tile-ink);border-radius:14px;padding:10px 4px;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Sora,sans-serif;transition:transform .15s,box-shadow .15s}
.tile b{font-size:27px;line-height:1;font-weight:800}
.tile span{font-size:12px;font-weight:700;margin-top:5px}
.grid.live .tile:not(.done):not(.off){cursor:pointer}
.grid.live .tile:not(.done):not(.off):hover{transform:scale(1.08);box-shadow:0 0 0 3px var(--cyan),0 0 24px rgba(0,184,240,.7);z-index:2}
.tile.done{background:var(--gc);border-color:var(--gc);color:var(--gt);cursor:default}
.tile.done span{font-size:11px}
.tile.off{opacity:.4;border-style:dashed}
.tile:not(.done):not(.off){cursor:not-allowed}
.grid.live .tile{cursor:pointer}
/* leaderboard */
.lb{position:sticky;top:12px}
.lbbox{position:relative}
.lbr{position:absolute;left:0;right:0;height:54px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:13px;background:var(--soft);border:1.5px solid var(--line);border-left:8px solid var(--gc);transition:transform .7s cubic-bezier(.2,.9,.25,1)}
.lbr .rk{width:30px;text-align:center;font-weight:800;font-family:Sora}
.lbr b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr small{display:block;font-weight:500;color:var(--muted);font-size:11px;line-height:1.1}
.lbr em{font-style:normal;font-weight:800;font-family:Sora;font-size:20px}
.lbr.pop{animation:pop .6s}
@keyframes pop{40%{transform:translateY(var(--ty)) scale(1.05)}}
.lbtoggle{display:none}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(4,14,34,.66);display:none;align-items:center;justify-content:center;padding:16px;z-index:60;backdrop-filter:blur(3px)}
.ov.show{display:flex}
.card{background:var(--surface);border-radius:24px;max-height:94vh;overflow:auto;width:100%;box-shadow:0 24px 80px rgba(0,0,0,.45);animation:in .22s ease-out}
@keyframes in{from{transform:scale(.94);opacity:0}}
.qcard{max-width:780px;padding:0}
.qhead{padding:18px 22px;background:linear-gradient(100deg,#0B2E8A,var(--accent) 55%,var(--cyan));color:#fff;border-radius:24px 24px 0 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.qhead h2{margin:0;font-size:clamp(22px,4vw,32px)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap}
.qmeta i{font-style:normal;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700}
.qbody{padding:20px 22px 24px}
.stim{background:var(--soft);border-left:5px solid var(--cyan);padding:12px 14px;border-radius:10px;margin-bottom:14px}
.qtext{font-size:clamp(17px,2.6vw,20px);font-weight:700;margin:0 0 14px;line-height:1.45}
.hint{color:var(--muted);font-size:13px;margin:-6px 0 12px}
.opts{display:grid;gap:10px;margin-bottom:16px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:2px solid var(--line);background:var(--soft);border-radius:14px;padding:12px 14px;transition:.12s}
.opt i{flex:none;width:32px;height:32px;border-radius:9px;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:800;font-family:Sora}
.opt:hover{border-color:var(--cyan)}
.opt.sel{border-color:var(--accent);background:rgba(20,87,255,.12)}
.opt.sel i{background:var(--accent);color:#fff;border-color:var(--accent)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:10px}
.pair select{padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--soft)}
.big{width:100%;font-size:17px;padding:14px}
.tm{height:12px;background:var(--line);border-radius:9px;margin:0 0 14px;position:relative;overflow:hidden}
.tm i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--ok),#F59F00,var(--bad));width:100%;transition:width 1s linear}
.tmv{font-weight:800;font-family:Sora;margin-bottom:4px;text-align:right}
.res{text-align:center;padding:14px 0 6px}
.res .ico{font-size:64px;line-height:1}
.res h3{font-size:30px;margin:6px 0}
.res.bad h3{color:var(--bad)}.res.ok h3{color:var(--ok)}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.plus{font-family:Sora;font-weight:800;font-size:44px;color:var(--ok);animation:pts .8s ease-out}
@keyframes pts{from{transform:translateY(24px) scale(.5);opacity:0}}
.gpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.gbtn{border:0;border-radius:14px;padding:14px 8px;font-weight:800;background:var(--gc);color:var(--gt);font-family:Sora;transition:transform .12s}
.gbtn:hover{transform:scale(1.06)}
.gbtn small{display:block;font-weight:600;opacity:.85}
.x{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.25);border:0;color:#fff;border-radius:50%;width:34px;height:34px;font-size:18px}
.qcard{position:relative}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:90;transition:transform .3s;max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.rankbn{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.7);background:var(--gc);color:var(--gt);padding:18px 28px;border-radius:18px;font:800 clamp(18px,3.4vw,30px) Sora,sans-serif;z-index:95;opacity:0;pointer-events:none;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);transition:.35s}
.rankbn.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:99;width:100%;height:100%}
/* small cards */
.mini{max-width:430px;padding:26px}
.mini h2{margin:0 0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
/* teacher panel */
.tp{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.tpin{max-width:1280px;margin:0 auto;padding:16px 18px 60px}
.tphead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tphead h2{margin:0;font-size:24px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.tab{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:700}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.stat small{color:var(--muted);display:block}
.stat b{font:800 24px Sora}
.tblw{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--soft);position:sticky;top:0;white-space:nowrap}
td.qt{min-width:260px;max-width:420px}
.pts button{border:1.5px solid var(--line);background:var(--soft);border-radius:7px;padding:2px 6px;font-weight:700;font-size:12px}
.pts button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tag{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--soft);border:1px solid var(--line)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;gap:6px;align-items:center;background:var(--soft);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.bar i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--accent),var(--cyan));min-width:3px}
.bar span{width:160px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qc li{margin:6px 0;list-style:none}
.qc{padding:0;margin:0}
.over-card{max-width:900px;padding:28px;text-align:center}
.over-card h1{font-size:clamp(34px,7vw,64px);margin:0;letter-spacing:.04em}
.champ{margin:18px auto;padding:22px;border-radius:22px;background:var(--gc);color:var(--gt)}
.champ h2{margin:4px 0;font-size:clamp(24px,4vw,38px)}
.champ .sc{font:800 clamp(30px,6vw,52px) Sora}
.fl{display:grid;gap:8px;text-align:left;margin:14px 0}
.fl .r{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--soft);border-left:8px solid var(--gc)}
.fl .r b{flex:none}.fl .r span{flex:1;color:var(--muted);font-size:13px}
.big-note{font-size:12.5px;color:var(--muted)}
@media (max-width:980px){
 .layout{grid-template-columns:1fr}
 .lbtoggle{display:inline-flex;position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40}
 .lb{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:45;transform:translateY(105%);transition:transform .3s;max-height:72vh;overflow:auto;border-radius:22px 22px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
 .lb.open{transform:none}
 .grid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
 .tile b{font-size:22px}
 .pair{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mypts{background:linear-gradient(100deg,var(--accent),var(--cyan));color:#fff;border-radius:16px;padding:16px;text-align:center}
.mypts small{display:block;opacity:.9}.mypts b{font:800 54px/1.1 Sora,sans-serif}
.mylist{display:grid;gap:6px;max-height:46vh;overflow:auto}
.myr{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--soft);border-left:8px solid var(--gc)}
.myr em{font-style:normal;font-weight:800;font-family:Sora}
</style>
</head>
<body>
<div class="wrap">
 <div class="top">
  <div class="brand">
   <h1><span class="flask">🧪</span><span id="hTitle">CLASS OF CHAMPION</span></h1>
   <p>Think Fast • Solve Smart • Become the Champion</p>
  </div>
  <div class="tools">
   <button class="btn ghost" id="bSound" title="Suara">🔊 Suara</button>
   <button class="btn" id="bTeacher">👨‍🏫 GURU</button>
  </div>
 </div>
 <div class="chips" id="chips"></div>

 <div id="loginView" class="login" hidden>
  <h2>Masuk ke Arena</h2>
  <p>Isi identitasmu untuk mulai bermain.</p>
  <label class="fld"><span>Nama lengkap</span><input id="lName" maxlength="60" autocomplete="name"></label>
  <label class="fld"><span>Kelas</span><select id="lKelas"></select></label>
  <label class="fld"><span>Nomor absen</span><input id="lAbsen" type="number" min="1" max="60" inputmode="numeric"></label>
  <div class="err" id="lErr"></div>
  <button class="btn big" id="lGo">Masuk</button>
 </div>

 <div id="gameView" hidden>
  <div class="welcome"><span id="wText"></span><button class="btn sm" id="bOut">Ganti siswa</button></div>
  <div class="layout">
   <div class="panel"><h3 id="gridTitle">Pilih kotak soal</h3><div class="grid" id="grid"></div></div>
   <aside class="panel lb" id="lb"><h3>⭐ POIN SAYA</h3><div id="lbbox"></div></aside>
  </div>
  <button class="btn lbtoggle" id="lbT">⭐ Poin saya</button>
 </div>
</div>

<div class="ov" id="ovQ"><div class="card qcard" id="qcard"></div></div>

<div class="ov" id="ovT"><div class="card mini">
 <h2>TEACHER ACCESS</h2><p class="big-note">Masukkan password guru</p>
 <label class="fld"><input id="tPw" type="password" autocomplete="current-password"></label>
 <div class="err" id="tErr"></div>
 <div class="row"><button class="btn" id="tGo">MASUK</button><button class="btn ghost" data-close="ovT">Batal</button></div>
</div></div>

<div class="ov" id="ovC" style="z-index:80"><div class="card mini">
 <h2 id="cT"></h2><p id="cM"></p>
 <div class="row"><button class="btn ghost" id="cNo">BATAL</button><button class="btn bad" id="cYes"></button></div>
</div></div>

<div class="ov" id="ovE" style="z-index:80"><div class="card mini" style="max-width:640px" id="eCard"></div></div>
<div class="ov" id="ovQC" style="z-index:80"><div class="card mini" style="max-width:560px" id="qcCard"></div></div>
<div class="ov" id="ovO"><div class="card over-card" id="oCard"></div></div>

<div id="tp" class="tp" hidden><div class="tpin" id="tpin"></div></div>
<div class="toast" id="toast"></div>
<div class="rankbn" id="rbn"></div>
<canvas id="cf"></canvas>

<script>
"use strict";
/* ================= DATA: BANK SOAL (SDGs, IX) ================= */

function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ================= SIMILARITY / QC ================= */
const STOP=new Set("yang dan atau dari pada untuk dengan adalah ini itu sebuah suatu dalam oleh sdgs tujuan sebagai agar karena bagi saja lebih akan dapat paling berikut semua pilih".split(" "));
function toks(q){const t=norm(q.q+" "+(q.stim||"")+" "+(q.type==="jodoh"&&q.opts?q.opts.map(p=>p.join(" ")).join(" "):"")).replace(/[^a-z0-9\s]/g," ").split(" ");return new Set(t.filter(w=>w.length>3&&!STOP.has(w)))}
function sim(a,b){const A=toks(a),B=toks(b);let i=0;A.forEach(w=>{if(B.has(w))i++});return i/((A.size+B.size-i)||1)}
const SIM_MAX=0.72;
function keyText(q){const f=fmt(q);
 if(f==="single")return q.opts[q.ans]||"";
 if(f==="multi")return q.ans.map(i=>q.opts[i]).join(" • ");
 if(f==="bs")return q.ans?"Benar":"Salah";
 if(f==="text")return [].concat(q.ans,q.alts||[]).join(" / ");
 if(f==="num")return [q.ans].concat(q.alts||[]).join(" / ");
 if(f==="long")return q.ans.map(g=>g.join("|")).join(" ; ");
 return q.opts.map(p=>p[0]+" → "+p[1]).join("; ")}
function findDup(){const bad=[];const seen=new Map();
 S.bank.forEach((q,i)=>{const k=norm(q.q+"|"+(q.stim||""));if(seen.has(k)){bad.push(i);return}
  for(let j=0;j<i;j++){if(bad.includes(j))continue;if(sim(q,S.bank[j])>=SIM_MAX){bad.push(i);return}}
  seen.set(k,i)});return bad}
function candidate(pts,exclude){const used=new Set(S.bank.map(b=>b.uid));const types=new Set(S.cfg.types);
 const cands=POOL.filter(p=>!used.has(p.uid)&&types.has(p.type)&&!(exclude&&exclude.has(p.uid)));
 const ok=c=>!S.bank.some(b=>sim(c,b)>=SIM_MAX);
 return cands.filter(c=>c.pts===pts&&ok(c))[0]||cands.filter(ok)[0]||null}
function putFromPool(i,c){const o=S.bank[i];S.bank[i]={...o,uid:c.uid,type:c.type,pts:c.pts,stim:c.stim,q:c.q,opts:JSON.parse(JSON.stringify(c.opts)),ans:JSON.parse(JSON.stringify(c.ans)),alts:[],attempts:0,wrong:0}}
function runQC(){let regen=0;
 for(let pass=0;pass<6;pass++){const bad=findDup().filter(i=>!S.bank[i].done);if(!bad.length)break;
  bad.forEach(i=>{const c=candidate(S.bank[i].pts,null);if(c){putFromPool(i,c);regen++}})}
 const act=S.bank.filter(q=>q.active),n=act.length,res=[];
 const dups=findDup();
 res.push(["Unique question check",!dups.length,dups.length?"Soal #"+dups.map(i=>S.bank[i].n).join(", #")+" terlalu mirip":"Tidak ada pertanyaan identik"]);
 res.push(["Semantic similarity check",!dups.length,dups.length?"Ada pasangan soal terlalu mirip":"Tidak ada soal dengan pola yang terlalu mirip"]);
 const cnt={};act.filter(q=>["isian","num"].includes(q.type)).forEach(q=>{const k=norm(keyText(q).split(" / ")[0]);cnt[k]=(cnt[k]||0)+1});
 const rep=Object.entries(cnt).filter(e=>e[1]>2);
 res.push(["Answer duplication check",!rep.length,rep.length?"Jawaban sama berulang: "+rep.map(e=>e[0]).join(", "):"Tidak ada jawaban yang berulang"]);
 const okPts=act.every(q=>LEVEL[q.pts]);
 res.push(["Difficulty check",okPts,okPts?"Seluruh poin berada pada 5, 10, 15, 20, atau 25":"Ada poin di luar 5–25"]);
 const dist=[5,10,15,20,25].map(p=>act.filter(q=>q.pts===p).length);
 const okD=n<5||dist.every(d=>d>0&&d<=n*0.4);
 res.push(["Point distribution check",okD,"Sebaran 5/10/15/20/25: "+dist.join(" / ")]);
 const ts=new Set(S.cfg.types);const okT=act.every(q=>ts.has(q.type));
 res.push(["Question type check",okT,okT?"Jenis soal sesuai pilihan guru":"Ada jenis soal di luar pilihan guru"]);
 const okR=act.every(q=>q.q&&q.q.trim()&&keyText(q));
 res.push(["Material relevance check",okR,okR?"Seluruh soal berasal dari materi SDGs dan memiliki kunci":"Ada soal tanpa teks atau kunci"]);
 const okG=act.every(q=>(q.q.length+(q.stim||"").length)<520);
 res.push(["Grade level check",okG,okG?"Bahasa dan panjang stimulus sesuai jenjang kelas IX":"Ada soal terlalu panjang"]);
 save();return{res,regen,pass:res.every(r=>r[1])&&n>0}}

/* ================= BANK GENERATION ================= */
function buildBank(){const types=new Set(S.cfg.types);const r=rng(hash("coc"+S.seed));
 const pool=POOL.filter(p=>types.has(p.type));const N=Math.min(+S.cfg.jumlah||100,pool.length);
 const byP={};[5,10,15,20,25].forEach(p=>byP[p]=shuffle(pool.filter(x=>x.pts===p),r));
 const per=Math.floor(N/5);let extra=N-per*5;const chosen=[];
 [5,10,15,20,25].forEach(p=>{const take=Math.min(per+(extra>0?1:0),byP[p].length);if(extra>0)extra--;chosen.push(...byP[p].splice(0,take))});
 const rest=shuffle([].concat(...Object.values(byP)),r);while(chosen.length<N&&rest.length)chosen.push(rest.shift());
 S.bank=shuffle(chosen,r).map((c,i)=>({n:i+1,uid:c.uid,type:c.type,pts:c.pts,stim:c.stim,q:c.q,opts:JSON.parse(JSON.stringify(c.opts)),ans:JSON.parse(JSON.stringify(c.ans)),alts:[],active:true,done:false,winner:null,by:null,attempts:0,wrong:0}));
 S.log=[];S.status="idle";save()}
if(!S.bank.length)buildBank();

function readResp(q){const f=fmt(q),root=$("#qbody");
 if(f==="single"){const e=root.querySelector(".opt.sel");return e?+e.dataset.oi:null}

 if(f==="multi"){const a=q.ans.slice().sort(),b=r.slice().sort();return a.length===b.length&&a.every((v,i)=>v===b[i])}

 return`<div class="panel"><h3>Kontrol permainan</h3><div class="row"><button class="btn ok" data-act="start" ${s==="idle"?"":"disabled"}>▶ START GAME</button><button class="btn" data-act="pause" ${s==="running"?"":"disabled"}>⏸ PAUSE GAME</button><button class="btn ok" data-act="resume" ${s==="paused"?"":"disabled"}>▶ RESUME GAME</button><button class="btn bad" data-act="end" ${s==="running"||s==="paused"?"":"disabled"}>🛑 END GAME</button></div>

 ${s==="over"?`<h3 style="margin-top:18px">Sesi selesai</h3><div class="row"><button class="btn" data-act="newses">Mulai sesi baru (reset skor)</button><button class="btn ghost" data-act="showover">Tampilkan layar Game Over</button></div>`:""}</div>`}
function tabGrp(){return`<div class="panel"><h3>Kelompok</h3><div class="tblw"><table><tr><th>Warna</th><th>Nama</th><th>Poin</th><th>Soal</th><th>Aksi</th></tr>${ranked().map(g=>`<tr><td><input type="color" data-gc="${g.id}" value="${g.hex}"></td><td><input data-gn="${g.id}" value="${esc(g.name)}" style="padding:7px 9px;border:1.5px solid var(--line);border-radius:9px;background:var(--soft)"></td><td><b>${g.score}</b></td><td>${g.solved}</td><td><div class="row" style="margin:0"><button class="btn sm ghost" data-gr="${g.id}">Reset skor</button><button class="btn sm bad" data-gd="${g.id}">Hapus</button></div></td></tr>`).join("")}</table></div><div class="row"><button class="btn" data-act="addg">+ Tambah kelompok</button></div><p class="big-note">Reset skor membuka kembali soal yang dimenangkan kelompok tersebut.</p></div>`}
function tabStat(){return tabStat0()+tabSwitchPanel()}
function tabSwitchPanel(){const by={};S.tabLog.forEach(e=>{const k=e.id;(by[k]=by[k]||{nama:e.siswa,kelas:e.kelas,n:0,sec:0,qs:{}});by[k].n++;by[k].sec+=e.detik;by[k].qs[e.n]=(by[k].qs[e.n]||0)+1});
 const rows=Object.values(by).sort((a,b)=>b.n-a.n);const last=S.tabLog.slice(-30).reverse();
 return`<div class="panel" style="margin-top:14px"><h3>Pindah tab saat menjawab soal</h3><p class="big-note">Pengaturan: ${S.cfg.trackTab?"aktif":"nonaktif"} • total kejadian: <b>${S.tabLog.length}</b></p>${rows.length?`<div class="tblw"><table><tr><th>Siswa</th><th>Kelas</th><th>Jumlah pindah tab</th><th>Total waktu di luar</th><th>Soal paling sering</th></tr>${rows.map(r=>{const top=Object.entries(r.qs).sort((a,b)=>b[1]-a[1])[0];return`<tr><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td><b>${r.n}</b></td><td>${Math.floor(r.sec/60)} menit ${r.sec%60} detik</td><td>#${top[0]} (${top[1]}x)</td></tr>`}).join("")}</table></div><h3 style="margin-top:14px">30 kejadian terakhir</h3><div class="tblw"><table><tr><th>Waktu</th><th>Siswa</th><th>Soal</th><th>Lama di luar</th></tr>${last.map(e=>`<tr><td>${ftime(e.t)}</td><td>${esc(e.siswa)}</td><td>#${e.n}</td><td>${e.detik} detik</td></tr>`).join("")}</table></div>`:"<p class='big-note'>Belum ada kejadian pindah tab tercatat.</p>"}</div>`}
function tabStat0(){const att=S.bank.reduce((a,q)=>a+q.attempts,0),wr=S.bank.reduce((a,q)=>a+(q.wrong||0),0),ok=att-wr;
 const most=[...S.bank].sort((a,b)=>b.attempts-a.attempts)[0],hard=[...S.bank].filter(q=>q.attempts>0).sort((a,b)=>(b.wrong/b.attempts)-(a.wrong/a.attempts)||b.wrong-a.wrong)[0];
 const rk=ranked().sort((a,b)=>b.solved-a.solved)[0];
 const dp={},dl={},dt={};S.bank.forEach(q=>{dp[q.pts+" poin"]=(dp[q.pts+" poin"]||0)+1;dl[LEVEL[q.pts]]=(dl[LEVEL[q.pts]]||0)+1;dt[TYPES[q.type]]=(dt[TYPES[q.type]]||0)+1});
 return`<div class="stats"><div class="stat"><small>Total percobaan</small><b>${att}</b></div><div class="stat"><small>Jawaban benar</small><b>${att?Math.round(ok/att*100):0}%</b></div><div class="stat"><small>Soal dikuasai</small><b>${S.bank.filter(q=>q.done).length}</b></div><div class="stat"><small>Paling sering dicoba</small><b>${most&&most.attempts?"#"+most.n:"-"}</b></div><div class="stat"><small>Soal paling sulit</small><b>${hard?"#"+hard.n:"-"}</b></div><div class="stat"><small>Kelompok terbanyak benar</small><b style="font-size:18px">${rk&&rk.solved?esc(rk.name):"-"}</b></div></div>
 <div class="two"><div class="panel"><h3>Distribusi poin</h3>${bars(dp)}</div><div class="panel"><h3>Distribusi tingkat kesulitan</h3>${bars(dl)}</div><div class="panel"><h3>Distribusi jenis soal</h3>${bars(dt)}</div></div>`}
function tabHist(){return`<div class="panel"><h3>Riwayat game</h3>${S.history.length?S.history.map(h=>`<div class="stat" style="margin-bottom:10px"><b style="font-size:16px">Tanggal: ${fdate(h.date)}</b><div>Mapel: ${esc(h.mapel)} • Kelas: ${esc(h.kelas)} • Materi: ${esc(h.materi)}</div><div>Pemenang: <b>${esc(h.winnerStudents.join(", ")||h.winnerGroup)}</b> (Kelompok ${esc(h.winnerGroup)})</div><div>Total soal: ${h.total} • Soal terjawab: ${h.answered} • Percobaan: ${h.attempts}</div><div class="row"><button class="btn sm ghost" data-hist="${h.id}">${openHist===h.id?"Tutup detail":"Lihat detail"}</button></div>${openHist===h.id?`<div class="fl">${h.ranking.map((r,i)=>`<div class="r"><b>${i+1}. ${esc(r.name)}</b><span>${esc(r.members.join(", ")||"—")}</span><b>${r.score}</b></div>`).join("")}<p class="big-note">Siswa berpoin: ${esc(h.students.join(", ")||"-")}</p></div>`:""}</div>`).join(""):"<p class='big-note'>Belum ada sesi yang diselesaikan. Sesi tersimpan otomatis saat END GAME.</p>"}</div>`}

/* ---- question editor ---- */
function serAns(q){const f=fmt(q);if(f==="single")return String(q.ans+1);if(f==="multi")return q.ans.map(i=>i+1).join(",");if(f==="bs")return q.ans?"benar":"salah";if(f==="text")return q.ans[0]||"";if(f==="num")return String(q.ans);if(f==="long")return q.ans.map(g=>g.join("|")).join(";");return""}
function serOpts(q){return q.opts?(fmt(q)==="match"?q.opts.map(p=>p.join("|")):q.opts).join("\n"):""}
function openEdit(n){const isNew=n===null;const q=isNew?{n:Math.max(0,...S.bank.map(b=>b.n))+1,uid:"u"+uid(),type:"pg",pts:10,stim:"",q:"",opts:["","","",""],ans:0,alts:[],active:true,done:false,winner:null,by:null,attempts:0,wrong:0}:S.bank.find(b=>b.n===n);
 const alts=fmt(q)==="text"?q.ans.slice(1).concat(q.alts||[]):(q.alts||[]);
 $("#eCard").innerHTML=`<h2>${isNew?"Tambah soal":"Edit soal #"+q.n}</h2>
 <label class="fld"><span>Jenis soal</span><select id="eType">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${q.type===k?"selected":""}>${v}</option>`).join("")}</select></label>
 <label class="fld"><span>Poin / tingkat kesulitan</span><select id="ePts">${[5,10,15,20,25].map(p=>`<option value="${p}" ${q.pts===p?"selected":""}>${p} poin — ${LEVEL[p]}</option>`).join("")}</select></label>
 <label class="fld"><span>Stimulus (opsional)</span><textarea id="eStim" rows="2">${esc(q.stim)}</textarea></label>
 <label class="fld"><span>Pertanyaan</span><textarea id="eQ" rows="3">${esc(q.q)}</textarea></label>
 <label class="fld"><span>Opsi (satu per baris; menjodohkan: kiri|kanan)</span><textarea id="eOpts" rows="5">${esc(serOpts(q))}</textarea></label>
 <label class="fld"><span>Kunci (pilihan: nomor opsi, mis. 2 atau 1,3 • benar/salah: benar atau salah • isian/numerik: jawaban • uraian: kata1|kata2;kata3|kata4)</span><input id="eKey" value="${esc(serAns(q))}"></label>
 <label class="fld"><span>Alternatif jawaban (pisahkan dengan titik koma)</span><input id="eAlt" value="${esc(alts.join(";"))}"></label>
 <label class="checks"><label><input type="checkbox" id="eAct" ${q.active?"checked":""}> Soal aktif</label></label>
 <div class="err" id="eErr"></div><div class="row"><button class="btn ok" id="eSave">SIMPAN</button><button class="btn ghost" data-close="ovE">Batal</button></div>`;
 $("#ovE").classList.add("show");
 $("#eSave").onclick=()=>{const t=$("#eType").value,key=$("#eKey").value.trim(),lines=$("#eOpts").value.split("\n").map(s=>s.trim()).filter(Boolean),alt=$("#eAlt").value.split(";").map(s=>s.trim()).filter(Boolean),qt=$("#eQ").value.trim();
  const er=m=>{$("#eErr").textContent=m};if(!qt)return er("Pertanyaan wajib diisi");
  const nq={...q,type:t,pts:+$("#ePts").value,stim:$("#eStim").value.trim(),q:qt,active:$("#eAct").checked,alts:[]};
  const f=(t==="pgk")?"multi":pgTypes.includes(t)?(/[,;]/.test(key)?"multi":"single"):({bs:"bs",isian:"text",uraian:"long",num:"num",jodoh:"match"}[t]);
  if(f==="single"||f==="multi"){if(lines.length<2)return er("Minimal 2 opsi");nq.opts=lines;const ix=key.split(/[,;]/).map(x=>parseInt(x)-1);if(ix.some(i=>isNaN(i)||i<0||i>=lines.length))return er("Kunci harus nomor opsi yang valid");nq.ans=f==="multi"?ix:ix[0]}
  else if(f==="bs"){if(!/^(benar|salah)$/i.test(key))return er("Kunci: benar atau salah");nq.opts=null;nq.ans=/^benar$/i.test(key)}
  else if(f==="text"){if(!key)return er("Kunci wajib diisi");nq.opts=null;nq.ans=[key];nq.alts=alt}
  else if(f==="num"){const v=parseNum(key);if(v===null)return er("Kunci harus angka");nq.opts=null;nq.ans=v;nq.alts=alt}
  else if(f==="long"){const g=key.split(";").map(x=>x.split("|").map(s=>s.trim()).filter(Boolean)).filter(a=>a.length);if(!g.length)return er("Isi kata kunci uraian");nq.opts=null;nq.ans=g;nq.alts=alt}
  else{const p=lines.map(l=>l.split("|").map(s=>s.trim()));if(p.length<2||p.some(x=>x.length<2||!x[0]||!x[1]))return er("Format menjodohkan: kiri|kanan, minimal 2 baris");nq.opts=p;nq.ans=null}
  if(!S.cfg.types.includes(t))S.cfg.types.push(t);
  if(isNew)S.bank.push(nq);else S.bank[S.bank.findIndex(b=>b.n===q.n)]=nq;
  save();$("#ovE").classList.remove("show");renderAll();toast("Soal tersimpan")}}

 if(t.dataset.regen){const i=S.bank.findIndex(b=>b.n===+t.dataset.regen);const c=candidate(S.bank[i].pts,null);if(!c){toast("Tidak ada soal baru yang cukup berbeda");return}putFromPool(i,c);save();renderAll();toast("Soal #"+S.bank[i].n+" diganti dengan soal baru");return}
 if(t.dataset.gr){const id=t.dataset.gr;confirmBox("Reset skor "+G(id).name+"?","Soal yang dimenangkan kelompok ini akan dibuka kembali.","YA, RESET",()=>{S.bank.forEach(q=>{if(q.winner===id){q.done=false;q.winner=null;q.by=null}});save();renderAll()});return}
 if(t.dataset.gd){const id=t.dataset.gd;if(S.groups.length<=1){toast("Minimal 1 kelompok");return}confirmBox("Hapus kelompok "+G(id).name+"?","Soal yang dimenangkan akan dibuka kembali.","YA, HAPUS",()=>{S.bank.forEach(q=>{if(q.winner===id){q.done=false;q.winner=null;q.by=null}});S.groups=S.groups.filter(g=>g.id!==id);save();renderAll()});return}
 if(t.dataset.hist){openHist=openHist===t.dataset.hist?null:t.dataset.hist;renderTP();return}
 const a=t.dataset.act;if(!a)return;
 if(a==="savecfg"){save();renderAll();toast("Konfigurasi tersimpan")}
 else if(a==="gen"){if(!S.cfg.types.length){toast("Pilih minimal satu jenis soal");return}const go=()=>{S.seed++;buildBank();const q=runQC();renderAll();toast("Bank soal dibuat: "+S.bank.length+" soal"+(q.pass?" • QC lolos":" • cek QC"))};S.bank.some(q=>q.done)?confirmBox("Generate ulang?","Progres dan skor sesi ini akan direset.","YA, GENERATE",go):go()}
 else if(a==="regenall"){const go=()=>{S.seed+=7;buildBank();runQC();renderAll();toast("Seluruh soal diregenerasi")};S.bank.some(q=>q.done)?confirmBox("Regenerate seluruh soal?","Progres dan skor sesi ini akan direset.","YA, REGENERATE",go):go()}
 else if(a==="addq")openEdit(null);
 else if(a==="qc"){const q=runQC();renderAll();$("#qcCard").innerHTML=`<h2>Quality Control Bank Soal</h2><ul class="qc">${q.res.map(r=>`<li>${r[1]?"✅":"❌"} <b>${r[0]}</b><br><span class="big-note">${esc(r[2])}</span></li>`).join("")}</ul>${q.regen?`<p class="big-note">🔄 ${q.regen} soal diganti otomatis.</p>`:""}<div class="row"><button class="btn" data-close="ovQC">Tutup</button></div>`;$("#ovQC").classList.add("show")}
 else if(a==="clearTab")confirmBox("Hapus catatan pindah tab?","Seluruh catatan pindah tab pada sesi ini akan dihapus.","YA, HAPUS",()=>{S.tabLog=[];save();renderAll()});
 else if(a==="start")startGame();
 else if(a==="pause"){setStatus("paused");if(curQ&&!pending){closeQ()}toast("Game dijeda")}
 else if(a==="resume"){setStatus("running");toast("Game dilanjutkan")}
 else if(a==="end")confirmBox("Apakah Anda yakin ingin mengakhiri permainan?","Skor akhir akan disimpan ke riwayat.","YA, GAME OVER",()=>endGame());

 else if(a==="showover")showOver();
 else if(a==="addg"){const i=S.groups.length;const c=COLORS[i%COLORS.length];S.groups.push({id:"g"+uid(),name:"Kelompok "+(i+1),hex:c[1],emo:""});save();renderAll()}
});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.cfg){const k=t.dataset.cfg;S.cfg[k]=t.type==="number"?+t.value:t.value;save();renderHead();return}
 if(t.dataset.cfgb){S.cfg[t.dataset.cfgb]=t.checked;save();return}
 if(t.dataset.type){const k=t.dataset.type;S.cfg.types=t.checked?[...new Set([...S.cfg.types,k])]:S.cfg.types.filter(x=>x!==k);save();return}
 if(t.dataset.gc){const g=G(t.dataset.gc);g.hex=t.value;g.emo="";save();renderAll();return}

document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#ovQ").classList.contains("show"))closeQ();return}
 if(e.key==="Enter"){if(e.target.id==="tPw")teacherLogin();else if(e.target.id==="aIn"&&e.target.tagName==="INPUT")submitQ();else if(["lName","lAbsen"].includes(e.target.id))login()}});
function login(){const nama=$("#lName").value.trim().replace(/\s+/g," "),kelas=$("#lKelas").value,absen=$("#lAbsen").value.trim(),er=$("#lErr");
 if(nama.length<3){er.textContent="Tulis nama lengkap (minimal 3 huruf).";return}
 if(!kelas){er.textContent="Pilih kelas.";return}
 if(!absen||+absen<1){er.textContent="Isi nomor absen dengan angka.";return}
 const id=slug(nama)+"_"+slug(kelas)+"_"+absen,now=new Date().toISOString();let s=S.students.find(x=>x.id===id);
 if(s)s.last_login=now;else S.students.push({id,nama,kelas,nomor_absen:+absen,created_at:now,last_login:now});
 ST={id,nama,kelas,absen,login:now};saveST();save();er.textContent="";renderAll()}

function tabActive(){return !!(S.cfg.trackTab&&ST&&curQ&&!pending&&S.status==="running")}
function leaveTab(){if(away||!tabActive())return;away={t:Date.now(),iso:new Date().toISOString(),n:curQ.n,id:ST.id,siswa:ST.nama,kelas:ST.kelas,absen:ST.absen}}
function backTab(){if(!away)return;const a=away;away=null;const d=Math.max(1,Math.round((Date.now()-a.t)/1000));
 S.tabLog.push({t:a.iso,id:a.id,siswa:a.siswa,kelas:a.kelas,absen:a.absen,n:a.n,detik:d});openSwitches++;save();
 if(S.cfg.tabWarn){toast("⚠️ Kamu berpindah tab ("+openSwitches+"x) dan dicatat oleh guru");sfx("wrong")}
 if(!$("#tp").hidden)renderTP()}
document.addEventListener("visibilitychange",()=>{document.hidden?leaveTab():backTab()});
window.addEventListener("blur",()=>{if(S.cfg.trackBlur)leaveTab()});
window.addEventListener("focus",()=>{if(S.cfg.trackBlur&&!document.hidden)backTab()});
